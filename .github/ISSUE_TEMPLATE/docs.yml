name: Docs
description: 문서 작업을 등록합니다.
title: "[Docs] "
labels: ["docs"]
body:
  - type: textarea
    id: summary
    attributes:
      label: 문서 작업 내용
      description: 작성하거나 수정할 문서 내용을 설명해주세요.
      placeholder: 예) 프로젝트 실행 방법과 브랜치 전략을 README에 추가합니다.
    validations:
      required: true

  - type: textarea
    id: target
    attributes:
      label: 문서 위치
      description: 수정할 문서 파일이나 추가할 문서 위치를 작성해주세요.
      placeholder: |
        - README.md
        - AGENTS.md
        - docs/...
    validations:
      required: true

  - type: textarea
    id: todo
    attributes:
      label: TODO
      description: 문서 작업 항목을 체크리스트로 작성해주세요.
      placeholder: |
        - [ ] 실행 방법 정리
        - [ ] 환경 변수 설명 추가
        - [ ] 브랜치 전략 설명 추가
    validations:
      required: true

  - type: textarea
    id: references
    attributes:
      label: 참고 자료
      description: 참고할 링크나 기존 문서가 있다면 첨부해주세요.
    validations:
      required: false
