name: Bug Report
description: 버그를 제보합니다.
title: "[Bug] "
labels: ["bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: 버그 설명
      description: 어떤 문제가 발생했는지 설명해주세요.
      placeholder: 예) 테마 목록 페이지에서 스크롤 시 카드가 겹쳐 보입니다.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: 재현 방법
      description: 버그를 재현하는 순서를 작성해주세요.
      placeholder: |
        1. 테마 커뮤니티 페이지로 이동
        2. 목록을 아래로 스크롤
        3. 특정 카드 클릭
        4. 오류 확인
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 기대 동작
      description: 원래 어떻게 동작해야 하나요?
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: 실제 동작
      description: 실제로 어떤 동작이 발생했나요?
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: 환경
      description: 사용 환경을 작성해주세요.
      value: |
        - OS:
        - Browser:
        - Device:
    validations:
      required: false

  - type: textarea
    id: screenshot
    attributes:
      label: 스크린샷
      description: 가능하다면 문제 화면을 첨부해주세요.
    validations:
      required: false